<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cardak">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>cardak</title>
<style>
:root {
  --bg: #12141a; --card: #1c1f27; --line: #2a2d36; --text: #d8dbe2; --muted: #8a8f9c;
  --waiting: #f0a040; --working: #5fc070; --idle: #8a8f9c; --over: #e06c75; --link: #6aa8ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-text-size-adjust: 100%;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 10px; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
#machine, #spend { color: var(--muted); font-size: 13px; }
#machine.warning { color: var(--waiting); }
#machine.critical { color: var(--over); }
#limits { width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
#limits .lim-sep { white-space: pre; }
#limits progress { appearance: none; -webkit-appearance: none; width: 64px; height: 8px; border: 0;
  border-radius: 4px; vertical-align: middle; background: var(--card); color: var(--muted); }
#limits progress::-webkit-progress-bar { background: var(--card); border-radius: 4px; }
#limits progress::-webkit-progress-value { background: var(--muted); border-radius: 4px; }
#limits progress::-moz-progress-bar { background: var(--muted); border-radius: 4px; }
#limits progress.lim-low::-webkit-progress-value { background: var(--waiting); }
#limits progress.lim-low::-moz-progress-bar { background: var(--waiting); }
#limits progress.lim-critical::-webkit-progress-value { background: var(--over); }
#limits progress.lim-critical::-moz-progress-bar { background: var(--over); }
#limits .lim-low { color: var(--waiting); }
#limits .lim-critical { color: var(--over); font-weight: 600; }
#limits .lim-unknown, #limits .lim-age { color: var(--muted); }
@media (max-width: 480px) {
  #limits progress { width: 36px; }
  #limits .lim-word { display: none; }
}
#fresh { width: 100%; color: var(--muted); font-size: 12px; }
#fresh.stale, #fresh.down { color: var(--waiting); }
#notice { display: none; background: var(--card); border-left: 4px solid var(--waiting);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
#notice.show { display: block; }
#warnings { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
main.dim { opacity: .5; }
h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 14px 0 6px; font-weight: 600; }
.card { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.wait { border-left: 4px solid var(--waiting); cursor: pointer; }
.row { display: flex; align-items: baseline; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 7px; color: var(--waiting);
  background: rgba(240, 160, 64, .18); white-space: nowrap; }
.line { margin-top: 3px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none;
  background: var(--line); align-self: center; }
.proj-head { cursor: pointer; }
.dots { display: inline-flex; gap: 3px; align-self: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--idle); }
.dot.waiting { background: var(--waiting); }
.dot.working { background: var(--working); }
.dot.shell { background: transparent; border: 1px solid var(--line); }
.spark { font-family: ui-monospace, monospace; color: var(--link); font-size: 12px; letter-spacing: -1px; }
.over { color: var(--over); }
.panes { margin-top: 8px; border-top: 1px solid var(--line); }
.pane { padding: 7px 0 6px; border-bottom: 1px solid var(--line); }
.pane:last-child { border-bottom: none; }
.pane.agent { cursor: pointer; }
.chev { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); padding: 8px 2px; }
#sheet { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 10; }
#sheet.show { display: flex; align-items: flex-end; justify-content: center; }
#sheet .panel { background: var(--card); width: 100%; max-width: 640px; max-height: 85vh; overflow: auto;
  border-radius: 16px 16px 0 0; padding: 14px 16px max(20px, env(safe-area-inset-bottom)); }
#sheet h3 { margin: 0 0 4px; font-size: 16px; }
#sheet h4 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 14px 0 4px; }
#sheet p { margin: 2px 0; overflow-wrap: anywhere; }
#trends, #figure { background: none; border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 2px 10px; font: inherit; font-size: 13px; }
#trends { margin-left: auto; }
#figure { margin: 6px 0 4px; padding: 4px 8px; }
.trend { padding: 8px 0 6px; border-bottom: 1px solid var(--line); }
.trend:last-child { border-bottom: none; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 36px; margin: 4px 0 2px; }
.bar { flex: 1; min-width: 0; height: 2px; background: var(--link); border-radius: 2px 2px 0 0; }
.bar.none { background: var(--line); }
.trend.all .bar { background: var(--working); }
.trend.all .bar.none { background: var(--line); }
.bar.sel { outline: 1px solid var(--text); }
.cplot { width: 100%; height: auto; display: block; margin: 6px 0 2px; }
.cplot .grid { stroke: var(--line); stroke-width: .6; stroke-dasharray: 2 2; }
.cplot .pick { fill: rgba(106, 168, 255, .14); }
.cplot text { fill: var(--muted); font-size: 7px; }
.cplot polyline { fill: none; stroke-width: 1.1; stroke-linejoin: round; }
.s0 { stroke: #56b6c2; } .s1 { stroke: #c678dd; } .s2 { stroke: #e5c07b; } .s3 { stroke: #98c379; }
.s4 { stroke: #61afef; } .s5 { stroke: #e06c75; } .s6 { stroke: #7fdbe6; } .s7 { stroke: #e08cf0; }
#close { float: right; background: none; border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; }
@media (min-width: 820px) {
  main { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 0 20px; align-items: start; }
  #sheet.show { align-items: center; }
  #sheet .panel { border-radius: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>cardak</h1>
  <span id="machine"></span>
  <span id="spend"></span>
  <span id="limits"></span>
  <button id="trends" type="button">Trends</button>
  <span id="fresh">connecting…</span>
</header>
<div id="notice"></div>
<div id="warnings"></div>
<main id="main">
  <section><h2 id="waiting-title">Waiting on you</h2><div id="waiting"></div></section>
  <section><h2>Projects</h2><div id="projects"></div></section>
</main>
<div id="sheet"><div class="panel"><button id="close" type="button">Close</button><div id="sheet-body"></div></div></div>
<script>
"use strict";
const POLL_MS = 3000;
const FETCH_TIMEOUT_MS = 5000;
const STALE_S = 10;
const TRENDS_EVERY_MS = 30000;
const NO_USAGE = "No usage yet: cardak counts it while the deck or the daemon runs.";
const NO_KEY = "open the link from `cardak web setup` (or scan its QR code) on this device";
const BAD_KEY = "this link's key is no longer valid · run `cardak web setup` on the computer";
const DOWN = "can't reach cardak · last data from ";
const ENDED = "this session has ended";
const KINDS = { permission: "Approve a tool", question: "Answer a question", finished: "Turn finished" };
const $ = (id) => document.getElementById(id);

let key = null, last = null, timer = null, sheetId = null, stopped = false, inflight = false;
const opened = new Set();
let trends = null, trendsOpen = false, trendsTimer = null, figure = "cost";
const ctxDay = new Map();  // project name -> the day picked on its context plot, across refreshes

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function add(parent, ...kids) { for (const k of kids) if (k) parent.appendChild(k); return parent; }
function clear(e) { while (e.firstChild) e.removeChild(e.firstChild); }

function age(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
function gb(bytes) {
  return bytes < 2 ** 30 ? Math.round(bytes / 2 ** 20) + " MB" : (bytes / 2 ** 30).toFixed(1) + " GB";
}
// " (32%)": a share of the machine's RAM (MemTotal), as the deck shows it; "" with no total
function share(bytes, total) {
  if (!total) return "";
  const v = bytes / total * 100;
  return v > 0 && v < 0.5 ? " (<1%)" : " (" + Math.round(v) + "%)";
}
function ram(bytes, total) { return gb(bytes) + share(bytes, total); }
// as the deck's fmt_usd: "$0.42" under $10, then whole dollars ("$1,204"); nothing is "$0"
function usd(v) {
  if (v === 0) return "$0";
  return v < 10 ? "$" + v.toFixed(2) : "$" + Math.round(v).toLocaleString("en-US");
}
// as the deck's fmt_count: "999", "1.2k", "340k", "1.2M", "3.4B"
function count(n) {
  for (const [unit, size] of [["B", 1e9], ["M", 1e6], ["k", 1e3]]) {
    if (n >= size) return n < 10 * size ? (n / size).toFixed(1) + unit : Math.round(n / size) + unit;
  }
  return String(Math.round(n));
}
function pct(v) { return v === null || v === undefined ? "–" : Math.round(v) + "%"; }
function clock(ts) {
  const d = new Date(ts * 1000);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function dot(agent) {
  return el("span", "dot " + (agent ? agent.status : "shell"));
}

function readKey() {
  const m = location.hash.match(/^#k=([A-Za-z0-9_-]+)/);
  if (m) {
    try { localStorage.setItem("cardak-key", m[1]); } catch (e) { /* private mode */ }
    return m[1];
  }
  try { return localStorage.getItem("cardak-key"); } catch (e) { return null; }
}

function notice(text) {
  const n = $("notice");
  n.textContent = text || "";
  n.classList.toggle("show", Boolean(text));
}

function renderMachine(m) {
  const box = $("machine");
  box.className = m && m.level ? m.level : "";
  if (!m) { box.textContent = ""; return; }
  let text = "RAM " + (m.mem_used / 2 ** 30).toFixed(1) + " / " + gb(m.mem_total) +
    share(m.mem_used, m.mem_total) + " · CPU " + pct(m.cpu_pct);
  if (m.swap_full) text += " · swap full";
  box.textContent = text;
}

const LIMIT_BAR = 15, LIMIT_STALE_S = 900, WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function limitBar(left) {
  const full = Math.round(left * LIMIT_BAR / 100);
  return "█".repeat(full) + "░".repeat(LIMIT_BAR - full);
}
function limitReset(at, now) {
  const d = new Date(at * 1000), hm = String(d.getHours()).padStart(2, "0") + ":" +
    String(d.getMinutes()).padStart(2, "0");
  return at - now < 86400 ? hm : WEEKDAYS[d.getDay()] + " " + hm;
}
function limitParts(l, now) {
  // [text, class, left] pieces: the same row as the deck's limits_label; a piece with `left` is a bar
  const parts = [];
  for (const [name, v, sep] of [["5h", l.five_hour, ""], ["week", l.seven_day, "   "]]) {
    if (sep) parts.push([sep, "lim-sep"]);
    if (v.left === null) { parts.push([name + " —", "lim-unknown"]); continue; }
    const cls = v.level === "ok" ? "" : "lim-" + v.level;
    parts.push([name + " ", ""], [limitBar(v.left), cls, v.left], [" " + v.left + "%", cls],
      [" left", "lim-word " + cls], [" · " + limitReset(v.resets_at, now), ""]);
  }
  if (l.age_s > LIMIT_STALE_S) parts.push([" · read " + Math.round(l.age_s / 60) + " min ago", "lim-age"]);
  return parts;
}
function renderLimits(l, now) {
  const box = $("limits");
  clear(box);
  if (!l) return;
  for (const [text, cls, left] of limitParts(l, now)) {
    const e = document.createElement(left === undefined ? "span" : "progress");
    if (left === undefined) e.textContent = text; else { e.max = 100; e.value = left; }
    if (cls.trim()) e.className = cls.trim();
    box.appendChild(e);
  }
}

function renderSpend(snap) {
  const box = $("spend");
  box.textContent = snap.month_spend === null || snap.month_spend === undefined ? "" :
    usd(snap.month_spend) + (snap.spend_unpriced ? "+" : "") + " this month at API prices";
}

function renderFresh(snap) {
  const f = $("fresh");
  const behind = snap.now - snap.ts;
  f.className = behind > STALE_S ? "stale" : "";
  f.textContent = behind > STALE_S ? "last update " + age(behind) + " ago" : "updated " + age(behind) + " ago";
}

function waitCard(w, now) {
  const card = el("div", "card wait");
  add(card, add(el("div", "row"),
    el("span", "tag", w.tag || "waiting"),
    el("b", "grow ellipsis", w.project),
    el("span", "muted", age(now - w.since))));
  add(card, el("div", "line", w.summary || w.reason || KINDS[w.kind] || ""));
  card.addEventListener("click", () => openSheet(w.session_id));
  return card;
}

function paneRow(p, now, total) {
  const row = el("div", "pane" + (p.agent ? " agent" : ""));
  const head = add(el("div", "row"), dot(p.agent), el("span", "grow ellipsis", p.label),
    el("span", "muted" + (p.over ? " over" : ""), ram(p.rss + p.mcp_rss, total)));
  add(row, head);
  const where = p.cwd_display === "." ? "" : p.cwd_display;
  let sub = where;
  if (p.agent) {
    const a = p.agent;
    const what = a.status === "waiting" ? (a.tag || "waiting") : a.status;
    sub = what + " " + age(now - a.since) + (where ? " · " + where : "");
  }
  add(row, el("div", "line small ellipsis", sub));
  if (p.agent && p.agent.summary && p.agent.status === "waiting") add(row, el("div", "line", p.agent.summary));
  if (p.agent) row.addEventListener("click", (e) => { e.stopPropagation(); openSheet(p.agent.session_id); });
  return row;
}

function projectCard(g, now, total) {
  const card = el("div", "card");
  const head = el("div", "row proj-head");
  const sw = el("span", "swatch");
  if (g.accent) sw.style.background = g.accent;
  const agents = g.panes.filter((p) => p.agent);
  const dots = el("span", "dots");
  for (const p of agents) add(dots, dot(p.agent));
  const isOpen = opened.has(g.name);
  add(head, g.kind === "other" ? null : sw, el("b", "grow ellipsis", g.name), dots,
    el("span", "spark", g.ram_spark), el("span", "muted" + (g.over ? " over" : ""), ram(g.rss, total)),
    el("span", "chev", isOpen ? "▾" : "▸"));
  add(card, head);
  const shells = g.panes.length - agents.length;
  const parts = [];
  if (g.spend_usd) parts.push(usd(g.spend_usd) + " this month");
  if (agents.length) parts.push(agents.length + (agents.length === 1 ? " agent" : " agents"));
  if (shells) parts.push(shells + (shells === 1 ? " pane" : " panes"));
  if (g.docker.length) parts.push(g.docker.length + " docker");
  parts.push("CPU " + pct(g.cpu_pct));
  add(card, el("div", "line small", (g.path ? g.path + " · " : "") + parts.join(" · ")));
  if (isOpen) {
    const list = el("div", "panes");
    for (const p of g.panes) add(list, paneRow(p, now, total));
    for (const d of g.docker) {
      add(list, add(el("div", "pane"), add(el("div", "row"), el("span", "dot shell"),
        el("span", "grow ellipsis", d.label), el("span", "muted", ram(d.rss, total)))));
    }
    if (!g.panes.length && !g.docker.length) add(list, el("div", "empty", "nothing running here"));
    add(card, list);
  }
  head.addEventListener("click", () => {
    if (opened.has(g.name)) opened.delete(g.name); else opened.add(g.name);
    if (last) render(last);
  });
  return card;
}

function render(snap) {
  renderMachine(snap.machine);
  renderSpend(snap);
  renderLimits(snap.plan_limits, snap.now);
  renderFresh(snap);
  $("main").classList.remove("dim");
  if (snap.error) {
    notice(snap.internal ? "cardak hit an internal error: " + snap.error : "WezTerm not reachable: " + snap.error);
  } else {
    notice("");
  }
  const warn = $("warnings");
  warn.textContent = snap.warnings.join(" · ");
  const waiting = $("waiting");
  clear(waiting);
  $("waiting-title").textContent = "Waiting on you" + (snap.waiting.length ? " · " + snap.waiting.length : "");
  if (!snap.waiting.length) add(waiting, el("div", "empty", "Nothing is waiting on you."));
  for (const w of snap.waiting) add(waiting, waitCard(w, snap.now));
  const projects = $("projects");
  clear(projects);
  for (const g of snap.projects) add(projects, projectCard(g, snap.now, snap.machine && snap.machine.mem_total));
  if (!snap.projects.length && !snap.error) add(projects, el("div", "empty", "No WezTerm panes."));
}

function down() {
  const f = $("fresh");
  f.className = "down";
  f.textContent = last ? DOWN + clock(last.ts) : "can't reach cardak";
  $("main").classList.add("dim");
}

function stop(text) {
  stopped = true;
  if (timer) clearInterval(timer);
  timer = null;
  notice(text);
  $("fresh").textContent = "";
}

async function get(path) {
  // a suspended computer never answers: give up rather than keep "updated 2s ago" on screen
  const abort = new AbortController();
  const timeout = setTimeout(() => abort.abort(), FETCH_TIMEOUT_MS);
  try {
    return await fetch(path, { headers: { Authorization: "Bearer " + key }, cache: "no-store", signal: abort.signal });
  } finally {
    clearTimeout(timeout);
  }
}

async function poll() {
  if (stopped || document.visibilityState !== "visible") return;
  if (inflight) return;
  inflight = true;
  try {
    await pollOnce();
  } finally {
    inflight = false;
  }
}

async function pollOnce() {
  let r;
  try {
    r = await get("/api/snapshot");
  } catch (e) {
    down();
    return;
  }
  if (r.status === 401) { stop(BAD_KEY); return; }
  if (r.status === 503) { $("fresh").textContent = "starting…"; return; }
  if (!r.ok) { down(); return; }
  try {
    last = await r.json();
  } catch (e) {
    down();
    return;
  }
  render(last);
  if (sheetId) loadSheet();
}

function section(body, title, ...lines) {
  add(body, el("h4", null, title));
  for (const l of lines) if (l) add(body, l);
}

async function loadSheet() {
  const id = sheetId;
  const body = $("sheet-body");
  let r;
  try {
    r = await get("/api/session/" + encodeURIComponent(id));
  } catch (e) {
    return; // the list says the computer can't be reached
  }
  if (id !== sheetId) return;
  if (r.status === 401) { closeSheet(); stop(BAD_KEY); return; }
  let s = null;
  if (r.ok) {
    try { s = await r.json(); } catch (e) { return; } // keep what the sheet shows
  }
  if (id !== sheetId) return;
  const panel = body.parentElement, scroll = panel.scrollTop;
  clear(body); // only now, so a refresh never blanks the sheet
  if (r.status === 404) { add(body, el("p", "muted", ENDED)); return; }
  if (!s) { add(body, el("p", "muted", "couldn't load this session")); return; }
  add(body, el("h3", null, s.project + " · claude"));
  add(body, el("p", "muted", s.status + " " + age(s.now - s.since)));
  if (s.status === "waiting") {
    section(body, "Needs", el("p", null, (s.tag ? s.tag + " · " : "") + (KINDS[s.kind] || "Waiting")),
      s.summary ? el("p", null, s.summary) : null, s.reason ? el("p", "muted", s.reason) : null);
  } else {
    section(body, "Needs", el("p", null, s.status === "working" ? "Nothing: it's working" : "Nothing"));
  }
  if (s.last_prompt) {
    const when = s.last_prompt_at ? " (" + age(s.now - s.last_prompt_at) + " ago)" : "";
    section(body, "You asked" + when, el("p", null, "“" + s.last_prompt + "”"));
  }
  if (s.turn !== null) {
    const files = s.turn_files.map((f) => el("p", "muted small", "edited " + f));
    section(body, "This turn", el("p", null, s.turn), ...files);
  }
  panel.scrollTop = scroll;
}

// as the history screen's ufmt: cost in dollars ("+": some replies had no price)
function figureText(v, key, incomplete) {
  if (v === null || v === undefined) return "-";
  if (key === "cost") return usd(v) + (incomplete ? "+" : "");
  if (key === "prompt_len") return Math.round(v) + " ch";
  return count(v);
}

function trendRow(r) {
  const f = r.figures[figure];
  const box = el("div", "trend" + (r.kind === "all" ? " all" : ""));
  add(box, add(el("div", "row"), el("b", "grow ellipsis", r.name),
    el("span", "muted small", "30 d " + figureText(f.window, figure, f.incomplete))));
  const strip = el("div", "bars");
  for (const d of f.days) {
    const bar = el("span", "bar" + (d === null ? " none" : ""));
    if (d !== null && f.top) bar.style.height = Math.max(4, d / f.top * 100) + "%"; // CSSOM: CSP allows it
    add(strip, bar);
  }
  add(box, strip);
  add(box, el("div", "line small", "today " + figureText(f.today, figure, f.incomplete_today) +
    " · per day " + figureText(f.per_day, figure) + " · peak " + figureText(f.peak, figure)));
  return box;
}

// context (#86): as core/context.position, a log scale from 10k to 1M
const LOG_LOW = 1e4, LOG_HIGH = 1e6, COLORS = 8;
const TICK_LABELS = { 10000: "10k", 100000: "100k", 1000000: "1M" };
const PW = 300, PH = 120, PAD = 22;  // the plot's viewBox and the room for its labels

function ctxPos(v) {
  if (v <= LOG_LOW) return 0;
  return Math.min(Math.log10(v / LOG_LOW) / Math.log10(LOG_HIGH / LOG_LOW), 1);
}

function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

function svg(tag, attrs) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, String(v));
  return e;
}

function svgText(x, y, text, anchor) {
  const t = svg("text", { x: x, y: y, "text-anchor": anchor || "start" });
  t.textContent = text;
  return t;
}

// each session's line between t0 and t1 (seconds since the window's start), a color each in
// order of the sessions drawn, on the log scale; `marks` are [fraction, label] under it
function ctxPlot(lines, t0, t1, ticks, marks, pick) {
  const s = svg("svg", { viewBox: "0 0 " + PW + " " + PH, class: "cplot" });
  const x = (t) => PAD + (t - t0) / (t1 - t0) * (PW - PAD);
  const y = (v) => PH - 12 - ctxPos(v) * (PH - 18);
  if (pick) add(s, svg("rect", { x: x(pick[0]), y: 0, width: x(pick[1]) - x(pick[0]), height: PH - 10, class: "pick" }));
  for (const t of ticks) {
    add(s, svg("line", { x1: PAD, x2: PW, y1: y(t), y2: y(t), class: "grid" }));
    add(s, svgText(PAD - 3, y(t) + 2.5, TICK_LABELS[t] || count(t), "end"));
  }
  let n = 0;
  for (const pts of lines) {
    const inside = pts.filter((p) => p[0] >= t0 && p[0] < t1);
    if (!inside.length) continue;
    const xy = inside.map((p) => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1));
    if (xy.length === 1) xy.push((x(inside[0][0]) + 1).toFixed(1) + "," + y(inside[0][1]).toFixed(1));
    add(s, svg("polyline", { points: xy.join(" "), class: "s" + (n++ % COLORS) }));
  }
  marks.forEach(([f, label], i) => {
    const anchor = i === 0 ? "start" : i === marks.length - 1 && f === 1 ? "end" : "middle";
    add(s, svgText(PAD + f * (PW - PAD), PH - 1, label, anchor));
  });
  return s;
}

function dayName(i) {
  const d = new Date(trends.first + "T00:00:00");
  d.setDate(d.getDate() + i);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

// as the deck's context_note
function ctxNote(d) {
  if (d === null) return "no sessions";
  return plural(d.sessions, "session") + " · peak " + count(d.peak) + " · " + plural(d.drops, "drop") +
    " · " + d.ended_clean + " ended without one";
}

function contextRow(r, c) {
  const ticks = c.ticks, at = c.day_starts;  // each local midnight, in seconds from the start
  const lines = r.lines.map((i) => c.lines[i]);  // each session's points are sent once
  const box = el("div", "trend" + (r.kind === "all" ? " all" : ""));
  const peak = r.peak === null ? "-" : count(r.peak);
  add(box, add(el("div", "row"), el("b", "grow ellipsis", r.name),
    el("span", "muted small", "30 d peak " + peak + " · " + plural(r.drops, "drop"))));
  const picked = ctxDay.get(r.name);
  const choose = (i) => { ctxDay.set(r.name, i); renderTrends(); };
  const strip = el("div", "bars");
  r.days.forEach((d, i) => {
    const bar = el("span", "bar" + (d === null ? " none" : "") + (picked === i ? " sel" : ""));
    if (d !== null) bar.style.height = Math.max(4, ctxPos(d.peak) * 100) + "%"; // CSSOM: CSP allows it
    bar.addEventListener("click", () => choose(i));
    add(strip, bar);
  });
  add(box, strip);
  const days = r.days.length;
  const pick = picked === undefined ? null : [at[picked], at[picked + 1]];
  const month = ctxPlot(lines, 0, at[days], ticks,
    [[0, dayName(0)], [0.5, dayName(Math.floor(days / 2))], [1, dayName(days - 1)]], pick);
  month.addEventListener("click", (e) => {
    const b = month.getBoundingClientRect();
    const f = ((e.clientX - b.left) / b.width * PW - PAD) / (PW - PAD);
    if (f < 0 || f > 1) return;
    const t = f * at[days];
    let i = 0;
    while (i < days - 1 && at[i + 1] <= t) i++;
    choose(i);
  });
  add(box, month);
  if (picked !== undefined) {
    add(box, el("div", "line small", dayName(picked) + ": " + ctxNote(r.days[picked])));
    add(box, ctxPlot(lines, at[picked], at[picked + 1], ticks,
      [[0, "00:00"], [0.25, "06:00"], [0.5, "12:00"], [0.75, "18:00"]], null));
  }
  return box;
}

function renderTrends() {
  const body = $("sheet-body");
  const panel = body.parentElement, scroll = panel.scrollTop;
  clear(body);
  add(body, el("h3", null, "Trends · last 30 days"));
  const pick = el("select");
  pick.id = "figure";
  for (const f of trends.figures) {
    const o = el("option", null, f.label);
    o.value = f.key;
    o.selected = f.key === figure;
    add(pick, o);
  }
  pick.addEventListener("change", () => {
    figure = pick.value;
    renderTrends();
    if (figure === "context" && !trends.context) loadTrends();
  });
  add(body, pick);
  if (!trends.rows.length) { add(body, el("p", "muted", NO_USAGE)); return; }
  add(body, add(el("div", "row muted small"), el("span", "grow", trends.first), el("span", null, trends.today)));
  if (figure === "context") {
    if (!trends.context) { add(body, el("p", "muted", "loading…")); return; }
    add(body, el("p", "muted small", "peak context per day, log scale · tap a day for its sessions"));
    for (const r of trends.context.rows) add(body, contextRow(r, trends.context));
    panel.scrollTop = scroll;
    return;
  }
  for (const r of trends.rows) if (r.figures[figure]) add(body, trendRow(r));
  if (figure === "cost" && trends.unpriced.length) {
    add(body, el("p", "muted small", "no price: " + trends.unpriced.join(", ")));
  }
  panel.scrollTop = scroll;
}

async function loadTrends() {
  if (!trendsOpen || document.visibilityState !== "visible") return;
  let r;
  try {
    r = await get("/api/trends" + (figure === "context" ? "?context=1" : ""));  // context only when shown
  } catch (e) {
    return; // the list says the computer can't be reached
  }
  if (!trendsOpen) return;
  if (r.status === 401) { closeSheet(); stop(BAD_KEY); return; }
  let t = null;
  if (r.ok) {
    try { t = await r.json(); } catch (e) { return; }
  }
  if (!trendsOpen) return;
  if (!t) {
    if (!trends) { clear($("sheet-body")); add($("sheet-body"), el("p", "muted", "couldn't load trends")); }
    return; // keep what the sheet shows
  }
  trends = t;
  renderTrends();
}

function openTrends() {
  closeSheet();
  trendsOpen = true;
  clear($("sheet-body"));
  add($("sheet-body"), el("p", "muted", "loading…"));
  $("sheet").classList.add("show");
  loadTrends();
  trendsTimer = setInterval(loadTrends, TRENDS_EVERY_MS);
}

function openSheet(id) {
  closeSheet();
  sheetId = id;
  clear($("sheet-body"));
  add($("sheet-body"), el("p", "muted", "loading…"));
  $("sheet").classList.add("show");
  loadSheet();
}

function closeSheet() {
  sheetId = null;
  trendsOpen = false;
  if (trendsTimer) clearInterval(trendsTimer);
  trendsTimer = null;
  $("sheet").classList.remove("show");
}

$("close").addEventListener("click", closeSheet);
$("trends").addEventListener("click", openTrends);
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { poll(); loadTrends(); }
});

key = readKey();
if (!key) {
  stop(NO_KEY);
} else {
  poll();
  timer = setInterval(poll, POLL_MS);
}
</script>
</body>
</html>
