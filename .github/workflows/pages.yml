# The landing page (#66): publishes site/ to GitHub Pages, served at brlauuu.dev/cardak.
#
# scripts/build_site.py copies site/ to _site/ and fills in the version from
# pyproject.toml, so the page follows every release without being edited. A version
# bump reaches main through the release PR, which is why there is no tag trigger (the
# github-pages environment takes deployments from the default branch only).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pyproject.toml"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: python scripts/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
